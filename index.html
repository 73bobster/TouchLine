<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchline">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Touchline</title>
<style>
:root{--p:#0b6b3a;--pt:#fff;--s:#fff;--st:#111;--bg:#f3f5f4;--card:#fff;--ink:#14201a;--mute:#5d6b63;--line:#dfe5e1;--bad:#c0392b;--ok:#1e8f4e;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{background:var(--p);color:var(--pt);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--s)}
header.top h1{margin:0;font-size:20px;line-height:1.2}
header.top .sub{font-size:13px;opacity:.85}
header.top .hrow{display:flex;align-items:center;gap:12px}
main{padding:14px 16px}
h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:5px;min-height:48px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px}
input[type=color]{padding:3px;height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
button{font:inherit;min-height:48px;border-radius:12px;border:0;padding:0 16px;cursor:pointer;color:var(--ink);background:#e9eeeb}
button:active{transform:scale(.98)}
button[disabled]{opacity:.45}
.btn{background:var(--p);color:var(--pt);font-weight:700}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);font-weight:600}
.btn.bad{background:var(--bad);color:#fff;font-weight:700}
.btn.block{display:block;width:100%}
.btn.lg{min-height:60px;font-size:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{min-height:44px;padding:0 14px;background:#fff;border:2px solid var(--line);border-radius:22px;font-weight:600}
.chips button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
.chips.small button{min-height:38px;font-size:14px;padding:0 12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.crest{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p);color:var(--pt);border:3px solid var(--s);font-weight:800;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;background:none;border-radius:0;min-height:62px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button i{font-style:normal;font-size:22px}
.tabs button.on{color:var(--p)}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.prow .num{width:44px;height:44px;border-radius:12px;background:var(--p);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none}
.prow .nm{flex:1;min-width:0;font-weight:600}
.prow .nm small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.prow.out .num{background:#9aa6a0}
.prow.sub .num{background:var(--s);color:var(--st);border:2px solid var(--p)}
.seg3{display:flex;gap:4px;flex:none}
.seg3 button{min-height:44px;min-width:50px;padding:0 8px;font-size:14px;font-weight:700;background:#eef2ef;border-radius:10px}
.seg3 button.on{background:var(--p);color:var(--pt)}
.seg3 button.on.o{background:#6b7770;color:#fff}
.seg3 button.on.b{background:var(--s);color:var(--st);outline:2px solid var(--p)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;background:#fff;border:2px solid var(--line);font-weight:700}
.seg button.on{background:var(--p);color:var(--pt);border-color:var(--p)}
.count{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:5px 11px;border-radius:20px;font-size:13px;font-weight:700;background:#e4e9e6}
.pill.ok{background:#d9f2e3;color:#14663a}.pill.warn{background:#fdf0d2;color:#8a5a00}.pill.bad{background:#fbdcd8;color:#8e2418}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sb .tm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.sb .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .tm.r{justify-content:flex-end;text-align:right}
.score{font-size:40px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clockbar{text-align:center;padding:10px 0 6px}
.clock{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pname{font-size:14px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.evg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.evg button{min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px;border-radius:14px}
.evg button i{font-style:normal;font-size:24px}
.evg button.big{min-height:92px;font-size:16px}
.evg .big.g{background:var(--p);color:var(--pt);border-color:var(--p);grid-column:span 2}
.evg .big.a{background:#26323a;color:#fff;border-color:#26323a;grid-column:span 1}
.log{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.log .mn{width:52px;flex:none;font-weight:800;font-variant-numeric:tabular-nums}
.log .tx{flex:1;min-width:0}.log .tx small{display:block;color:var(--mute)}
.log button{min-height:40px;min-width:40px;padding:0 8px;background:#eef2ef}
#sheet{position:fixed;inset:0;background:rgba(10,20,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-h h3{margin:0;flex:1;font-size:19px}
.sheet-h button{min-height:44px;min-width:44px;padding:0 10px;background:#eef2ef}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.pb{min-height:66px;background:#fff;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:0}
.pb b{font-size:24px;line-height:1.1}.pb span{font-size:13px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb.alt{background:#f3f5f4;border-style:dashed}
.big-in{font-size:22px;text-align:center}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:6px 0}
.note{font-size:13px;color:var(--mute);margin:6px 0 14px}
.hero{text-align:center;padding:22px 10px 8px}
.hero .res{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;background:var(--p);color:var(--pt)}
.hero .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.hero .meta{color:var(--mute);font-size:14px}
.irow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.irow:last-child{border:0}
.irow b{width:56px;flex:none;font-variant-numeric:tabular-nums}
.stat{font-size:12px;color:var(--mute)}
.ocrbox{border:2px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:12px;text-align:center}
.ocrbox input{display:none}
.ocrbox label{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;margin:0;border-radius:12px;background:var(--p);color:var(--pt);font-size:16px;font-weight:700;cursor:pointer}
.bad-in{border-color:var(--bad)!important}
a{color:var(--p);font-weight:600}
.linkbtn{background:none;color:var(--mute);text-decoration:underline;min-height:44px;font-weight:600}

.sbadge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:14px;background:rgba(255,255,255,.2);color:var(--pt);white-space:nowrap;flex:none}
.sbadge.ok{background:rgba(255,255,255,.2)}.sbadge.warn{background:#fdf0d2;color:#8a5a00}.sbadge.bad{background:#fbdcd8;color:#8e2418}
.tabs button{min-width:0;padding:0 2px;font-size:11px}.tabs button i{font-size:20px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
.tbl table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--mute);background:#f7f9f8;position:sticky;top:0}
.tbl td.n,.tbl th.n{position:sticky;left:0;background:#fff;font-weight:800;z-index:1}
.tbl th.n{background:#f7f9f8}
.tbl td.nm,.tbl th.nm{position:sticky;left:42px;background:#fff;text-align:left;font-weight:600;z-index:1;box-shadow:2px 0 3px rgba(0,0,0,.05);min-width:104px}
.tbl th.nm{background:#f7f9f8}
.tbl tr[data-act]{cursor:pointer}
.tbl tfoot td{font-weight:800;background:#f7f9f8}
.pitchwrap{margin:6px 0 10px}
.pitch{position:relative;border-radius:16px;background:#2e8b4a;overflow:hidden;height:370px;border:3px solid #1f6b37;display:flex;flex-direction:column;justify-content:space-around;padding:38px 4px 8px;user-select:none;-webkit-user-select:none}
.pitch::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 46px,transparent 46px 92px)}
.pitch .pl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitch .line{position:relative;display:flex;justify-content:space-evenly;align-items:center}
.goalmouth{position:absolute;top:0;left:50%;transform:translateX(-50%);width:52%;height:34px;border:3px solid #fff;border-top:0;border-radius:0 0 8px 8px;background:rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.tk{width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;cursor:pointer}
.tk[data-drag]{touch-action:none;cursor:grab}
.tk b{position:relative;width:42px;height:42px;border-radius:50%;background:var(--p);color:var(--pt);border:3px solid var(--s);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tk b em{position:absolute;top:-9px;right:-12px;font-style:normal;font-size:12px;background:#fff;color:#111;border-radius:10px;padding:0 3px}
.tk b u{position:absolute;top:-4px;left:-5px;width:10px;height:14px;background:#f5c518;border-radius:2px;border:1px solid #8a6d00}
.tk span{font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#dfe7e2;border-radius:14px;min-height:84px;align-items:center;margin-bottom:10px}
.bench .tk span{color:var(--ink);text-shadow:none}
.bench .bl{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg);flex:none}
.bench i{font-style:normal;color:var(--mute);font-size:14px}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.dz{min-height:58px;border:2px dashed #aab5ae;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mute);background:#fff}
.dz i{font-style:normal;font-size:20px}
.drop-on{outline:4px solid var(--p);outline-offset:-2px;background:#d9f2e3!important}
.pitch .drop-on{outline-color:#fff}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-70%);opacity:.92}
.clock.sm{font-size:40px}.clockbar.sm{padding:4px 0}
.hint{font-size:12px;color:var(--mute);margin:-2px 0 10px}
.chips.small.tight{margin-bottom:6px}
.att{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.att .top{display:flex;align-items:center;gap:12px}
.att .num{width:40px;height:40px;border-radius:11px;background:var(--p);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.att .nm{flex:1;min-width:0;font-weight:600}
.att.in .num{background:var(--ok)}.att.late .num{background:var(--warn)}.att.out .num{background:#9aa6a0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:#e4e9e6;margin-right:4px}
.tag.ok{background:#d9f2e3;color:#14663a}.tag.warn{background:#fdf0d2;color:#8a5a00}.tag.bad{background:#fbdcd8;color:#8e2418}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600;background:#fdf0d2;color:#6b4700}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] textarea,fieldset[disabled] button.sw{opacity:.7}
#toast button{background:rgba(255,255,255,.2);color:#fff;min-height:32px;margin-left:12px;padding:0 12px;border-radius:16px;font-weight:700}

/* ---------- responsive: small phone → desktop ---------- */
html{-webkit-text-size-adjust:100%}
.pitch{height:clamp(300px,46vh,560px)}
.tk{width:clamp(50px,15vw,64px)}
.tk b{width:clamp(38px,11vw,48px);height:clamp(38px,11vw,48px)}
.lv{display:block}
.cols{display:block}
@media (max-width:380px){
  .tabs button{font-size:10px}.tabs button i{font-size:18px}
  .clock{font-size:46px}.score{font-size:34px}
  .evg{gap:8px}.evg button{min-height:66px;font-size:13px}
  .att .top{flex-wrap:wrap}.att .seg3{width:100%}.att .seg3 button{flex:1}
  main{padding-left:12px;padding-right:12px}
  .tray{grid-template-columns:repeat(3,1fr)}
  .tbl th,.tbl td{padding:8px 6px}
}
@media (min-width:600px){
  html{font-size:17px}
  #app{max-width:none}.tabs div{max-width:820px}
  main{max-width:820px;margin:0 auto;padding:18px 24px}
  header.top{padding-left:24px;padding-right:24px}
  header.top .hrow,header.top .sb{max-width:772px;margin:0 auto}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  #sheet{align-items:center}
  .sheet-in{border-radius:22px;max-width:620px;max-height:86vh;padding:18px 22px}
  .pitch{height:clamp(380px,56vh,620px)}
  .tk{width:68px}.tk b{width:50px;height:50px;font-size:19px}.tk span{font-size:12px;max-width:70px}
  .evg button{min-height:84px;font-size:15px}
  .btn.lg{min-height:64px}
  .tabs button{font-size:13px}
  #toast{bottom:90px!important}
}
@media (min-width:600px) and (orientation:landscape) and (max-width:1023px){
  .lv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 20px;align-items:start}
  .pitch{height:clamp(340px,60vh,560px)}
}
@media (min-width:1024px){
  html{font-size:17px}
  #app{max-width:none;margin:0 0 0 232px;padding-bottom:28px}
  .tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:0}
  .tabs div{flex-direction:column;max-width:none;margin:0;padding:18px 12px;gap:4px}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;min-height:54px;padding:0 16px;font-size:16px;border-radius:12px;text-align:left}
  .tabs button i{font-size:22px;width:28px}
  .tabs button.on{background:var(--p);color:var(--pt)}
  .tabs button:hover:not(.on){background:#eef2ef}
  header.top .hrow,header.top .sb{max-width:1040px}
  main{max-width:1088px;margin:0 auto;padding:24px 32px}
  body[data-tab=team] main,body[data-view=auth] main,body[data-view=noteam] main{max-width:700px}
  .lv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .pitch{height:clamp(440px,64vh,680px)}
  .cols{grid-template-columns:1fr 1fr}
  .sheet-in{max-width:660px}
  .count{top:calc(66px + env(safe-area-inset-top))}
  .tray{grid-template-columns:repeat(6,1fr)}
  button:not(:disabled):hover{filter:brightness(.97)}
  .prow[data-act]:hover,.tbl tr[data-act]:hover td{background:#f4f8f6}
}
@media (min-width:1440px){
  html{font-size:18px}
  #app{margin-left:260px}.tabs{width:260px}
  main{max-width:1240px}
  .cols{grid-template-columns:1fr 1fr 1fr}
}
@media (max-height:520px) and (orientation:landscape){
  header.top{padding-top:6px;padding-bottom:6px}
  .tabs button{min-height:46px;flex-direction:row;gap:6px;font-size:12px}
  .clock{font-size:38px}.clockbar{padding:2px 0}
  .pitch{height:clamp(220px,70vh,420px)}
  #app{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .lv{display:block}
  .lv-a{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 16px;align-items:start}
  .lv-a>.pitchwrap{grid-column:1;grid-row:1/span 6}
  .lv-a>:not(.pitchwrap){grid-column:2}
  .pitch{height:calc(100vh - 210px);min-height:190px}
  .tk b{width:34px;height:34px;font-size:15px}.tk{width:46px}.tk span{font-size:10px}
  .bench{min-height:64px;padding:4px 8px}.dz{min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<noscript>Touchline needs JavaScript.</noscript>
<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const LOCAL=/[?&]local=1/.test(location.search);
const CLOUD=!LOCAL;
const KEY=CLOUD?'touchline-v2':'touchline-v2-local';
const OCR=true;
const AUTH_URL='https://ep-icy-union-zai4i905.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth';
const REST_URL='https://ep-icy-union-zai4i905.apirest.c-2.eu-west-2.aws.neon.tech/neondb/rest/v1';
const num=x=>x===''||x==null||isNaN(+x)?null:+x;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}};
function lum(hex){const h=String(hex||'#000').replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)}
const textOn=hex=>lum(hex)>.4?'#111':'#fff';

const PRESETS=[['Red / white','#c8102e','#ffffff'],['Blue / white','#1d4ed8','#ffffff'],['Green / white','#0b6b3a','#ffffff'],['Black / gold','#111111','#f5c518'],['Sky / navy','#6cb4ee','#1b2a49'],['Maroon / sky','#7a1f3d','#8ecae6'],['Orange / black','#f57c00','#111111'],['Navy / white','#0b2a5b','#ffffff']];

 {k:'goal',l:'Goal',i:'⚽',c:'big g'},{k:'oppgoal',l:'Goal against',i:'🥅',c:'big a'},

  }
  return db}

/* ---------- match logic ---------- */
function elapsedMs(m){const c=m.clock;return c.accMs+(c.state==='running'?Date.now()-c.startedAt:0)}
function pname(m,n){if(m.periods===2)return n===1?'1st half':'2nd half';if(m.periods===4)return 'Quarter '+n;return 'Period '+n}
function curStamp(m){
  const c=m.clock;const base=(c.period-1)*m.periodMins;
  if(c.state==='ready')return{period:c.period,minute:0};
  return{period:c.period,minute:base+Math.floor(elapsedMs(m)/60000)+1};
}
function fmtMin(e,m){
  const end=e.period*m.periodMins;
  if(e.minute>end&&m.periods>0)return end+'+'+(e.minute-end)+"'";
  return e.minute+"'";
}
function fmtClock(m){
  const base=(m.clock.period-1)*m.periodMins*60000;
  const t=Math.floor((base+elapsedMs(m))/1000);
  return pad(Math.floor(t/60))+':'+pad(t%60);
}
function pitchSet(m){
  const set=new Set(Object.keys(m.squad).filter(id=>m.squad[id].role==='starter'));
  for(const e of m.events){
    if(e.t==='sub'){set.delete(e.offId);set.add(e.onId)}
    if(e.t==='red'&&e.playerId)set.delete(e.playerId);
  }
  return set;
}
function benchIds(m){
  const on=pitchSet(m);const sentOff=new Set(m.events.filter(e=>e.t==='red').map(e=>e.playerId));
  return Object.keys(m.squad).filter(id=>['starter','sub'].includes(m.squad[id].role)&&!on.has(id)&&!sentOff.has(id));
}
const byNum=ids=>ids.filter(id=>P(id)).sort((a,b)=>P(a).num-P(b).num);
function score(m){
  let us=0,them=0;
  for(const e of m.events){
    if(e.t==='goal'){if(e.how==='Own goal')them++;else us++}
    else if(e.t==='oppgoal')them++;
  }
  return{us,them};
}
function describe(e,m){
  const L=id=>esc(label(id));
  const a=e.assistId?' · assist '+L(e.assistId):'';
  switch(e.t){
    case 'goal':
      if(e.how==='Opp own goal')return '⚽ Goal — opposition own goal';
      if(e.how==='Own goal')return '⚽ Own goal — '+L(e.playerId);
      return '⚽ Goal — '+L(e.playerId)+(e.how?' ('+esc(e.how.toLowerCase())+')':'')+a;
    case 'oppgoal':{const w=[e.oppNum?'#'+e.oppNum:'',e.oppName||''].filter(Boolean).join(' ');return '🥅 Goal against'+(w?' — '+esc(w):'')+(e.how?' ('+esc(e.how.toLowerCase())+')':'')}
    case 'shot':return '🎯 Shot'+(e.detail?' ('+esc(e.detail.toLowerCase())+')':'')+' — '+L(e.playerId);
    case 'keypass':return '🔑 Key pass — '+L(e.playerId);
    case 'save':return '🧤 Key save'+(e.detail?' ('+esc(e.detail.toLowerCase())+')':'')+' — '+L(e.playerId);
    case 'tackle':return '🛡️ '+esc(e.detail||'Key tackle')+' — '+L(e.playerId);
    case 'yellow':return '🟨 Yellow card — '+L(e.playerId);
    case 'red':return '🟥 Red card — '+L(e.playerId);
    case 'sub':return '🔄 Sub — '+L(e.onId)+' on for '+L(e.offId)+(e.reason?' ('+esc(e.reason.toLowerCase())+')':'');
    case 'note':return '📝 '+esc(e.text||'');
    case 'period':return '⏱ '+esc(e.label);
  }
  return esc(e.t);
}
const sortedEvents=m=>m.events.map((e,i)=>({e,i})).sort((a,b)=>a.e.period-b.e.period||a.e.minute-b.e.minute||a.i-b.i).map(x=>x.e);

function stats(pid){
  const o={sel:0,played:0,started:0,goals:0,assists:0,shots:0,key:0,saves:0,tackles:0,yc:0,rc:0};
  for(const m of S.matches){
    if(m.status!=='done')continue;
    const r=m.squad[pid];if(!r||(r.role!=='starter'&&r.role!=='sub'))continue;
    o.sel++;
    if(r.role==='starter')o.started++;
    if(r.role==='starter'||m.events.some(e=>e.t==='sub'&&e.onId===pid))o.played++;
    for(const e of m.events){
      if(e.t==='goal'&&e.playerId===pid&&e.how!=='Own goal')o.goals++;
      if(e.t==='goal'&&e.assistId===pid)o.assists++;
      if(e.t==='shot'&&e.playerId===pid)o.shots++;
      if(e.t==='keypass'&&e.playerId===pid)o.key++;
      if(e.t==='save'&&e.playerId===pid)o.saves++;
      if(e.t==='tackle'&&e.playerId===pid)o.tackles++;
      if(e.t==='yellow'&&e.playerId===pid)o.yc++;
      if(e.t==='red'&&e.playerId===pid)o.rc++;
    }
  }
  o.apps=o.played;
  return o;
}
function attStats(pid){
  const o={marked:0,attended:0,late:0,early:0,absent:0,notified:0,noshow:0};
  for(const x of S.sessions){const a=x.records&&x.records[pid];if(!a)continue;
    o.marked++;
    if(a.attended){o.attended++;if(a.late)o.late++;if(a.leftEarly)o.early++}
    else{o.absent++;if(a.reason==='Notified in advance')o.notified++;if(a.reason==='No-show')o.noshow++}}
  o.pct=o.marked?Math.round(100*o.attended/o.marked):null;
  return o;
}

function applyTheme(){

  const r=document.documentElement.style;
  r.setProperty('--p',p);r.setProperty('--pt',textOn(p));r.setProperty('--s',s);r.setProperty('--st',textOn(s));
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',p);
}

function resultCard(m){
  const sc=score(m);const res=sc.us>sc.them?'W':sc.us<sc.them?'L':'D';
  const col=res==='W'?'var(--ok)':res==='L'?'var(--bad)':'var(--warn)';
  return `<div class="prow" data-act="histOpen" data-id="${m.id}" style="cursor:pointer"><div class="num" style="background:${col};color:#fff">${res}</div><div class="nm">${esc(S.team.name)} ${sc.us}–${sc.them} ${esc(m.opp)}<small>${esc(m.comp||'')} · ${m.venue==='home'?'Home':m.venue==='away'?'Away':'Neutral'} · ${esc(dateStr(m))}</small></div><span style="color:var(--mute)">›</span></div>`;
}
function dateStr(m){try{return new Date(m.date+'T'+(m.time||'12:00')).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return m.date}}

/* ---------- roster parsing / OCR ---------- */
function parseRoster(text,existing){
  const rows=[];
  for(let line of String(text||'').split(/\r?\n/)){
    line=line.replace(/["|•·_]+/g,' ').replace(/\t+/g,' ').replace(/\s+/g,' ').trim();
    if(/^(no\.?|number|num|#|shirt)?\s*[,;:]?\s*(name|player|players)\b/i.test(line))continue;
    if(!line)continue;
    let num=null,name=line,m;
    if((m=line.match(/^#?\s*(\d{1,2})(?:\s*[.):\-–—,;]\s*|\s+)(.+)$/))){num=+m[1];name=m[2]}
    else if((m=line.match(/^(.+?)[\s,;\-–—:.]+#?(\d{1,2})$/))){name=m[1];num=+m[2]}
    name=name.replace(/[^A-Za-zÀ-ÿ'’\-. ]/g,'').replace(/\s+/g,' ').trim();
    if(name.length<2)continue;
    rows.push({num,name});
  }
  const used=new Set(existing.map(String));rows.forEach(r=>{if(r.num!=null)used.add(String(r.num))});
  let n=1;rows.forEach(r=>{if(r.num==null){while(used.has(String(n)))n++;r.num=n;used.add(String(n))}});
  return rows;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function runOCR(file){
  const I=V.imp;I.err='';I.busy='Loading the reader…';renderSheet();
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    I.busy='Reading the photo…';renderSheet();
    const res=await window.Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text'){I.busy='Reading the photo… '+Math.round(m.progress*100)+'%';const n=document.querySelector('.ocrbox .note');if(n)n.textContent=I.busy}}});
    I.text=(res.data&&res.data.text)||'';I.busy='';
    I.rows=parseRoster(I.text,activePlayers().map(p=>p.num));
    if(!I.rows.length){I.rows=null;I.err="Couldn't find any names in that photo. Try a clearer shot, or type the list."}
  }catch(e){I.busy='';I.err="Couldn't read the photo — the reader needs a data connection the first time. You can paste or type the list instead."}
  if(V.sheet&&V.sheet.kind==='import')renderSheet();
}

async function importFile(f){
  const I=V.imp;I.err='';
  if(/^image\//.test(f.type)||/\.(png|jpe?g|heic|webp)$/i.test(f.name)){
    if(!OCR){I.err='Reading photos is only in the installed app. Type or paste the list instead.';renderSheet();return}
    return runOCR(f)}
  if(/\.(csv|tsv|txt)$/i.test(f.name)||/^text\//.test(f.type)){
    try{I.text=await f.text();I.rows=parseRoster(I.text,activePlayers().map(p=>p.num));
      if(!I.rows.length){I.rows=null;I.err="Couldn't find any players in that file. It should have one player per line, number and name."}}
    catch(e){I.err="Couldn't open that file."}
  }else I.err='That file type is not supported yet. Use CSV, text or a photo.';
  if(V.sheet&&V.sheet.kind==='import')renderSheet();
}

/* ---------- actions ---------- */
function newMatch(){
  const t=S.team;const last=S.matches.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
  const m={id:uid(),opp:'',venue:'home',location:t.ground||'',comp:last?last.comp:'League',date:todayStr(),time:nowHM(),squad:{},events:[],status:'setup',periods:t.periods,periodMins:t.periodMins,onPitch:t.onPitch,clock:{period:1,state:'ready',startedAt:null,accMs:0},notes:'',createdAt:Date.now()};
  S.matches.push(m);S.activeId=m.id;V.step='details';V.err='';save();
}
function addEvent(m,o){
  const st=curStamp(m);const id=uid();
  m.events.push(Object.assign({id,period:st.period,minute:st.minute,ts:Date.now()},o));
  save();buzz();V.sheet=null;render();return id;
}
function addEventUndo(m,o){const id=addEvent(m,o);toast('Recorded',{label:'Undo',fn:()=>{m.events=m.events.filter(e=>e.id!==id);save();render()}},5000)}
function logPeriod(m,labelTxt){const st=curStamp(m);m.events.push({id:uid(),t:'period',label:labelTxt,period:st.period,minute:st.minute,ts:Date.now()})}
function freeze(m){const c=m.clock;if(c.state==='running'){c.accMs+=Date.now()-c.startedAt;c.startedAt=null}}
let wake=null;
async function lockScreen(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function unlockScreen(){try{wake&&wake.release()}catch(e){}wake=null}

function ask(o){V.sheet=Object.assign({kind:'confirm',back:V.sheet},o);renderSheet()}
const CONFIRMS={
  delEvent(id){const m=logMatch();m.events=m.events.filter(e=>e.id!==id);save();V.sheet={kind:'log'};render()},
  delSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);V.sess=null;save();V.sheet=null;render()},
  endPeriod(){const m=M();freeze(m);const c=m.clock;
    if(c.period<m.periods){logPeriod(m,m.periods===2?'Half time':'End of '+pname(m,c.period));c.period++;c.accMs=0;c.state='break'}
    else{logPeriod(m,'Full time');c.state='full'}
    save();V.sheet=null;render()},
  finishEarly(){const m=M();freeze(m);logPeriod(m,'Match ended early');m.clock.state='full';save();V.sheet=null;render()},
  cancelMatch(){const m=M();S.matches=S.matches.filter(x=>x.id!==m.id);S.activeId=null;save();V.sheet=null;V.err='';render()},
  playerRemove(id){const p=P(id);if(p)p.left=true;save();V.sheet=null;render()},
  reset(){DB=blankDB();DB.user={id:'local',email:'',name:'You',isSuper:true};S=EMPTY();V.tab='match';V.matchId=null;V.draft={name:'',age:'',ground:'',primary:'#0b6b3a',secondary:'#ffffff',onPitch:11,periods:2,periodMins:45};save();V.sheet=null;render()}
};

function matchSummary(m){
  const sc=score(m),ev=sortedEvents(m),live=m.status!=='done';
  const nm=id=>{const p=P(id);return p?p.name:'a player'};
  const res=sc.us>sc.them?'won':sc.us<sc.them?'lost':'drew';
  const where=m.venue==='home'?'at home to':m.venue==='away'?'away to':'against';
  const when=m.date?' on '+(()=>{try{return new Date(m.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long'})}catch(e){return m.date}})():'';
  const out=[];
  const state=sc.us>sc.them?'leading':sc.us<sc.them?'trailing':'level at';
  out.push(live?`${S.team.name} are ${state} ${sc.us}–${sc.them} ${where} ${m.opp}${m.comp?' in the '+m.comp:''}.`
    :`${S.team.name} ${res} ${sc.us}–${sc.them} ${where} ${m.opp}${m.comp?' in the '+m.comp:''}${when}.`);
  const first=ev.filter(e=>e.period===1);
  if(!live&&m.periods>=2&&ev.some(e=>e.t==='goal'||e.t==='oppgoal')){
    const h=score({events:first});out.push(`It was ${h.us}–${h.them} at half-time.`)}
  const gl=ev.filter(e=>e.t==='goal'&&e.how!=='Own goal');
  if(gl.length){
    const g={};gl.forEach(e=>{const k=e.how==='Opp own goal'?'opposition own goal':nm(e.playerId);(g[k]=g[k]||[]).push(fmtMin(e,m)+(e.how==='Penalty'?' (pen)':''))});
    out.push('Scorers: '+Object.keys(g).map(k=>k+' '+g[k].join(', ')).join('; ')+'.');
    const as=gl.filter(e=>e.assistId).map(e=>nm(e.assistId));
    if(as.length)out.push('Assists: '+as.join(', ')+'.')}
  const ag=ev.filter(e=>e.t==='oppgoal'||(e.t==='goal'&&e.how==='Own goal'));
  if(ag.length)out.push('Conceded: '+ag.map(e=>(e.t==='goal'?'own goal by '+nm(e.playerId):(e.oppName||'opposition'))+' '+fmtMin(e,m)+(e.how==='Penalty'?' (pen)':'')).join(', ')+'.');
  if(!gl.length&&!ag.length&&!live)out.push('A goalless draw.');
  const yc=ev.filter(e=>e.t==='yellow').length,rc=ev.filter(e=>e.t==='red');
  if(yc||rc.length)out.push('Discipline: '+[yc?yc+' yellow'+(yc>1?'s':''):'',rc.length?rc.length+' red ('+rc.map(e=>nm(e.playerId)).join(', ')+')':''].filter(Boolean).join(', ')+'.');
  const sb=ev.filter(e=>e.t==='sub').length;
  if(sb)out.push(sb+' substitution'+(sb>1?'s':'')+' made.');
  return out.join(' ');
}
function shareText(m){
  const sc=score(m);const ev=sortedEvents(m);
  const head=`FT ⚽ ${S.team.name} ${sc.us}–${sc.them} ${m.opp}`;
  const meta=[m.comp,m.venue==='home'?'Home':m.venue==='away'?'Away':'Neutral',dateStr(m)].filter(Boolean).join(' · ');
  const gl=ev.filter(e=>e.t==='goal'&&e.how!=='Own goal').map(e=>{
    const who=e.how==='Opp own goal'?'Opposition own goal':(P(e.playerId)?P(e.playerId).name:'');
    return `${fmtMin(e,m)} ${who}${e.assistId&&P(e.assistId)?` (assist ${P(e.assistId).name})`:''}`});
  const og=ev.filter(e=>e.t==='goal'&&e.how==='Own goal').length;
  const ag=ev.filter(e=>e.t==='oppgoal').map(e=>`${fmtMin(e,m)} ${[e.oppNum?'#'+e.oppNum:'',e.oppName||''].filter(Boolean).join(' ')||'Opposition'}`);
  const cards=ev.filter(e=>e.t==='yellow'||e.t==='red').map(e=>`${e.t==='yellow'?'🟨':'🟥'} ${P(e.playerId)?P(e.playerId).name:''}`);
  return [head,meta,'',matchSummary(m),'',gl.length?'Goals:\n'+gl.join('\n'):'',ag.length||og?'Against:\n'+ag.join('\n')+(og?'\n(plus '+og+' own goal'+(og>1?'s':'')+')':''):'',cards.length?cards.join('\n'):'',m.notes?'\n'+m.notes:''].filter(x=>x!=='').join('\n');
}

function act(a,ds,el){
  const m=M();
  if(actExtra(a,ds,el))return;
  switch(a){
    case 'tab':V.tab=ds.tab;V.matchId=null;V.sheet=null;V.sess=null;V.newTeam=false;break;
    case 'createTeam':{
      const t=V.draft;if(!t.name.trim()){V.err='Give your team a name first.';break}
      V.err='';S.team=Object.assign({},t,{name:t.name.trim()});save();V.tab='squad';break}
    case 'preset':{const p=PRESETS[+ds.i];const t=T();t.primary=p[1];t.secondary=p[2];save();break}
    case 'fmt':{const f=FORMATS[+ds.i];const t=T();t.onPitch=f[1];t.periods=f[2];t.periodMins=f[3];save();break}
    case 'backup':V.sheet={kind:'share',title:'Backup',note:'Copy this and keep it somewhere safe, such as a note or an email to yourself. Use Restore to bring it back.',d:{text:JSON.stringify(S)}};renderSheet();return;
    case 'restoreOpen':V.sheet={kind:'restore',d:{text:''}};renderSheet();return;
    case 'restoreDo':{
      try{const o=JSON.parse(V.sheet.d.text);if(!o||!Array.isArray(o.players)||!Array.isArray(o.matches))throw new Error('shape');
        const td=Object.assign(EMPTY(),o,{role:'coach'});td.team=Object.assign({id:'local'},td.team);DB.teams.local=td;DB.cur='local';S=td;save();V.sheet=null;V.tab='match';V.matchId=null;break}
      catch(e){V.sheet.err="That doesn't look like a Touchline backup.";renderSheet();return}}
    case 'copyText':{
      const t=V.sheet.d.text,ta=document.getElementById('sharetext');
      const fallback=()=>{if(ta){ta.focus();ta.select()}toast('Touch and hold the text to copy')};
      try{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),fallback)}catch(e){fallback()}
      return}
    case 'nativeShare':{try{navigator.share({text:V.sheet.d.text}).catch(()=>{})}catch(e){}return}
    case 'reset':ask({title:'Reset everything?',msg:'This deletes your team, squad and all matches from this phone. Download a backup first if you want to keep them.',ok:'Delete it all',danger:true,fn:'reset'});return;

    /* squad */
    case 'playerNew':V.sheet={kind:'player',d:{num:nextNum(),name:'',pos:''}};renderSheet();return;
    case 'playerRestore':{const p=P(ds.id);V.sheet={kind:'player',d:{id:p.id,num:p.num,name:p.name,pos:p.pos||'',restore:true}};renderSheet();return}
    case 'playerEdit':{const p=P(ds.id);V.sheet={kind:'player',d:{id:p.id,num:p.num,name:p.name,pos:p.pos||''}};renderSheet();return}
    case 'posPick':{const d=V.sheet.d;d.pos=d.pos===ds.val?'':ds.val;renderSheet();return}
    case 'playerSave':{
      const s=V.sheet,d=s.d;const num=parseInt(d.num,10);
      if(!(num>=0&&num<=99)){s.err='Enter a squad number.';renderSheet();return}
      if(!String(d.name||'').trim()){s.err='Enter a name.';renderSheet();return}
      if(activePlayers().some(p=>p.num===num&&p.id!==d.id)){s.err='Number '+num+' is already taken.';renderSheet();return}
      if(d.id){const p=P(d.id);p.num=num;p.name=d.name.trim();p.pos=d.pos;if(d.restore)p.left=false}
      else S.players.push({id:uid(),num,name:d.name.trim(),pos:d.pos,left:false});
      save();V.sheet=null;break}
    case 'playerRemove':ask({title:V.sheet.d.name+' has left the squad?',msg:'Their number becomes free for someone else. Their past match records stay, and you can bring them back from Former players.',ok:'Yes, they left',danger:true,fn:'playerRemove',arg:V.sheet.d.id});return;
    case 'importOpen':V.imp={text:'',rows:null,busy:'',err:''};V.sheet={kind:'import'};renderSheet();return;
    case 'importParse':{
      const I=V.imp;I.rows=parseRoster(I.text,activePlayers().map(p=>p.num));
      if(!I.rows.length){I.rows=null;I.err='No names found — put one player per line, e.g. “7 Jack Brown”.'}else I.err='';
      renderSheet();return}
    case 'importBack':V.imp.rows=null;renderSheet();return;
    case 'importDel':V.imp.rows.splice(+ds.i,1);if(!V.imp.rows.length)V.imp.rows=null;renderSheet();return;
    case 'importAdd':{
      const I=V.imp;const exist=new Set(activePlayers().map(p=>String(p.num)));const seen=new Set();let bad=false;
      I.rows.forEach(r=>{const k=String(r.num);if(r.num===''||r.num==null||exist.has(k)||seen.has(k))bad=true;seen.add(k)});
      if(bad){I.err='Fix the red numbers first.';renderSheet();return}
      I.rows.forEach(r=>{if(String(r.name).trim())S.players.push({id:uid(),num:+r.num,name:String(r.name).trim(),pos:'',left:false})});
      save();V.sheet=null;V.imp=null;break}

    /* match setup */
    case 'matchNew':newMatch();break;
    case 'venue':{m.venue=ds.v;const g=S.team.ground||'';if(ds.v==='home'&&!m.location)m.location=g;if(ds.v!=='home'&&m.location===g)m.location='';save();break}
    case 'matchNext':
      if(!String(m.opp||'').trim()){V.err='Who are you playing?';break}
      V.err='';V.step='lineup';break;
    case 'backDetails':V.step='details';V.err='';break;
    case 'cancelMatch':ask({title:'Cancel this match?',msg:'Nothing has been recorded yet, so it will just be discarded.',ok:'Discard',cancel:'Keep it',danger:true,fn:'cancelMatch'});return;
    case 'role':{
      const cur=m.squad[ds.id];
      if(cur&&cur.role===ds.role)delete m.squad[ds.id];
      else m.squad[ds.id]={role:ds.role,reason:ds.role==='out'?(cur&&cur.reason)||'':''};
      V.err='';save();break}
    case 'reason':{const r=m.squad[ds.id];r.reason=r.reason===ds.val?'':ds.val;save();break}
    case 'restSub':activePlayers().forEach(p=>{if(!m.squad[p.id])m.squad[p.id]={role:'sub',reason:''}});save();break;
    case 'toLive':{
      const st=Object.values(m.squad).filter(r=>r.role==='starter').length;
      if(!st){V.err='Pick at least one starter.';break}
      activePlayers().forEach(p=>{if(!m.squad[p.id])m.squad[p.id]={role:'out',reason:'Unknown'};else if(m.squad[p.id].role==='out'&&!m.squad[p.id].reason)m.squad[p.id].reason='Unknown'});
      m.status='live';V.err='';save();break}
    case 'editLineup':m.status='setup';V.step='lineup';save();break;

    /* clock */
    case 'ko':{const c=m.clock;c.state='running';c.startedAt=Date.now();c.accMs=0;logPeriod(m,m.periods===2?'Kick-off':pname(m,c.period)+' start');save();lockScreen();break}
    case 'pause':freeze(m);m.clock.state='paused';save();break;
    case 'resume':m.clock.state='running';m.clock.startedAt=Date.now();save();break;
    case 'endPeriod':ask({title:'End '+pname(m,m.clock.period)+'?',msg:m.clock.period<m.periods?'The clock stops until you start the next period.':'This is the last period — the match goes to full time.',ok:'End it',fn:'endPeriod'});return;
    case 'nextPeriod':{const c=m.clock;c.state='running';c.startedAt=Date.now();c.accMs=0;logPeriod(m,pname(m,c.period)+' start');save();break}
    case 'finishEarly':ask({title:'End match early?',msg:'Use this if the game is abandoned or stopped. The score so far stands.',ok:'End match',danger:true,fn:'finishEarly'});return;
    case 'finish':{
      m.status='done';m.finishedAt=Date.now();S.activeId=null;V.tab='history';V.matchId=m.id;V.sheet=null;save();unlockScreen();break}
    case 'continueMatch':S.activeId=VM().id;V.tab='match';V.matchId=null;break;

    /* events */
    case 'ev':
      if(ds.k==='oppgoal')V.sheet={kind:'oppgoal',d:{oppNum:'',oppName:'',how:''}};
      else if(ds.k==='note')V.sheet={kind:'note',d:{text:''}};
      else V.sheet={kind:ds.k,step:0,d:{}};
      renderSheet();return;
    case 'pick':{pick(ds.id!==undefined?ds.id:ds.val);return}
    case 'sback':{const s=V.sheet;s.step=Math.max(0,s.step-1);if(s.kind==='sub'&&s.d.on&&s.step===1)s.step=0;renderSheet();return}
    case 'oppHow':{V.sheet.d.how=V.sheet.d.how===ds.val?'':ds.val;V.sheet.keepScroll=true;renderSheet();return}
    case 'oppSave':{const d=V.sheet.d;addEvent(m,{t:'oppgoal',oppNum:d.oppNum||'',oppName:(d.oppName||'').trim(),how:d.how||''});return}
    case 'noteSave':{const d=V.sheet.d;if(!String(d.text||'').trim()){return}addEvent(m,{t:'note',text:d.text.trim()});return}
    case 'logOpen':V.sheet={kind:'log'};renderSheet();return;
    case 'evMin':{const mm=VM();const e=mm.events.find(x=>x.id===ds.id);V.sheet={kind:'evMin',d:{id:e.id,minute:e.minute}};renderSheet();return}
    case 'evMinSave':{const d=V.sheet.d;const mm=VM();const e=mm.events.find(x=>x.id===d.id);const n=parseInt(d.minute,10);if(n>=0)e.minute=n;save();V.sheet={kind:'log'};render();return}
    case 'evDel':ask({title:'Delete this event?',msg:'It will be removed from the log and the score will update.',ok:'Delete',danger:true,fn:'delEvent',arg:ds.id});return;
    case 'closeSheet':closeSheet();return;
    case 'cancelConfirm':{const b=V.sheet.back;V.sheet=b||null;renderSheet();return}
    case 'okConfirm':{const s=V.sheet;V.sheet=s.back||null;CONFIRMS[s.fn](s.arg);return}

    /* history / share */
    case 'histOpen':V.matchId=ds.id;V.tab='history';break;
    case 'histBack':V.matchId=null;break;
    case 'share':V.sheet={kind:'share',title:'Share summary',d:{text:shareText(VM())}};renderSheet();return;
  }
  render();
}
const nextNum=()=>{const u=new Set(activePlayers().map(p=>p.num));let n=1;while(u.has(n))n++;return n};

function pick(val){
  const s=V.sheet,d=s.d,k=s.kind,m=M();
  switch(k){
    case 'goal':
      if(s.step===0){
        if(val==='OPPOG')return addEvent(m,{t:'goal',playerId:null,how:'Opp own goal'});
        d.pid=val;s.step=1;
      }else if(s.step===1){
        d.how=val;
        if(val==='Penalty'||val==='Own goal')return addEvent(m,{t:'goal',playerId:d.pid,how:val});
        s.step=2;
      }else return addEvent(m,{t:'goal',playerId:d.pid,how:d.how,assistId:val||null});
      break;
    case 'shot':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'shot',playerId:d.pid,detail:val});break;
    case 'keypass':return addEvent(m,{t:'keypass',playerId:val});
    case 'save':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'save',playerId:d.pid,detail:val});break;
    case 'tackle':
      if(s.step===0){d.pid=val;s.step=1}else return addEvent(m,{t:'tackle',playerId:d.pid,detail:val});break;
    case 'yellow':return addEvent(m,{t:'yellow',playerId:val});
    case 'red':return addEvent(m,{t:'red',playerId:val});
    case 'sub':
      if(s.step===0){d.off=val;s.step=d.on?2:1}
      else if(s.step===1){d.on=val;s.step=2}
      else return addEvent(m,{t:'sub',offId:d.off,onId:d.on,reason:val});
      break;
  }
  renderSheet();
}

let toastT=null,TOAST_FN=null;

  TOAST_FN=actn?actn.fn:null;t.innerHTML=esc(msg)+(actn?`<button data-act="toastAct">${esc(actn.label)}</button>`:'');t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';TOAST_FN=null},ms||2200)}

/* ---------- binding ---------- */
function root(name){
  if(name==='team')return T();
  if(name==='m')return VM();
  if(name==='sheet')return V.sheet&&V.sheet.d;
  if(name==='imp')return V.imp;
  if(name==='auth')return V.auth;
  return null;
}
function setPath(path,val){
  const parts=path.split('.');const r=root(parts[0]);if(!r)return false;
  let o=r;for(let i=1;i<parts.length-1;i++)o=o[parts[i]];
  o[parts[parts.length-1]]=val;return true;
}
document.addEventListener('input',e=>{
  const el=e.target;
  let path=el.dataset.bind;
  if(!path&&el.dataset.sbind){path=el.dataset.sbind.startsWith('imp.')?el.dataset.sbind:'sheet.'+el.dataset.sbind}
  if(!path)return;
  let v=el.value;
  if(el.dataset.num==='1')v=v===''?'':+v;
  if(el.type==='number'&&path.startsWith('imp.rows')&&v!=='')v=+v;
  setPath(path,v);
  if(path.startsWith('team.')){applyTheme();save();if(el.dataset.render==='crest'){const c=document.querySelector('.crest');if(c)c.outerHTML=crest(T(),+c.style.width.replace('px',''))}}
  else if(path.startsWith('m.'))save();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.actChange==='ocr'&&el.files&&el.files[0])runOCR(el.files[0]);
  else if(el.dataset.actChange==='impfile'&&el.files&&el.files[0])importFile(el.files[0]);
  else if(el.dataset.rr==='1'){const d=V.sheet.d;if(d.isNew&&el.dataset.sbind==='t'){['playerId','assistId','how','detail','offId','onId','reason','oppNum','oppName','text'].forEach(k=>{d[k]=''})}renderSheet()}
  else if(el.dataset.bind&&el.tagName==='SELECT'){render()}
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.dataset.actChange)return;
  if(el.tagName==='LABEL')return;
  act(el.dataset.act,el.dataset,el);
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&V.sheet&&V.sheet.kind!=='confirm')closeSheet()});

/* ---------- cloud: sign-in + offline-first sync (Neon Auth + Data API) ---------- */
const SYNC={busy:false,state:CLOUD&&DB.user?(navigator.onLine?'idle':'offline'):'idle',msg:'',jwt:null,exp:0,timer:null,last:0};
const TABLES=['teams','players','matches','match_squad','match_events','sessions','attendance'];
const PK={teams:['id'],players:['id'],matches:['id'],match_squad:['match_id','player_id'],match_events:['id'],sessions:['id'],attendance:['session_id','player_id']};
function jwtPayload(t){try{const p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-p.length%4)%4)))}catch(e){return {}}}
async function getJwt(force){
  if(!force&&SYNC.jwt&&SYNC.exp-Date.now()>120000)return SYNC.jwt;
  const r=await fetch(AUTH_URL+'/token',{credentials:'include'});
  if(!r.ok){const e=new Error('auth');e.code='auth';e.status=r.status;throw e}
  const j=await r.json();SYNC.jwt=j.token;SYNC.exp=(jwtPayload(j.token).exp||0)*1000;return SYNC.jwt;
}
async function rest(method,path,body,prefer,retried){
  const jwt=await getJwt();
  const r=await fetch(REST_URL+path,{method,headers:Object.assign({Authorization:'Bearer '+jwt,'Content-Type':'application/json'},prefer?{Prefer:prefer}:{}),body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401&&!retried){await getJwt(true);return rest(method,path,body,prefer,true)}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    if(!retried&&j&&/not-null constraint/.test(j.message||'')&&/user_id/.test(j.message||''))return rest(method,path,body,prefer,true);
    const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e;
  }
  return j;
}
async function authCall(path,body){
  const r=await fetch(AUTH_URL+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'Could not sign in');
  return j;
}
const BLOCKED="You're signed in, but this browser blocked the sign-in cookie, so the app can't reach your team data. On iPhone: Settings > Apps > Safari > turn off Prevent Cross-Site Tracking, or use Chrome.";

async function doAuth(){
  const a=V.auth;a.err='';
  if(!a.email.trim()||!a.password){a.err='Enter your email and password.';render();return}
  if(a.mode==='up'&&a.password.length<8){a.err='Use a password of at least 8 characters.';render();return}
  a.busy=true;render();
  try{

/* row mapping */
function rowsFor(TD){
  const tid=TD.team.id,t=TD.team;
  const R={teams:{},players:{},matches:{},match_squad:{},match_events:{},sessions:{},attendance:{}};
  R.teams[tid]={id:tid,name:t.name||'',age:t.age||'',ground:t.ground||'',primary_colour:t.primary||null,secondary_colour:t.secondary||null,on_pitch:num(t.onPitch),periods:num(t.periods),period_mins:num(t.periodMins),deleted:false};
  TD.players.forEach(p=>{R.players[p.id]={id:p.id,team_id:tid,num:num(p.num),name:p.name||'',pos:p.pos||null,left_squad:!!p.left,deleted:false}});
  TD.matches.forEach(m=>{
    R.matches[m.id]={id:m.id,team_id:tid,opp:m.opp||'',venue:m.venue||'home',location:m.location||'',comp:m.comp||'',match_date:m.date||null,match_time:m.time||null,status:m.status||'setup',periods:num(m.periods),period_mins:num(m.periodMins),on_pitch:num(m.onPitch),clock:m.clock||null,notes:m.notes||'',rec_mode:m.recMode||null,created_at_ms:m.createdAt||null,finished_at_ms:m.finishedAt||null,deleted:false};
    for(const pid in m.squad){const r=m.squad[pid];R.match_squad[m.id+'|'+pid]={match_id:m.id,player_id:pid,team_id:tid,role:r.role,reason:r.reason||null,deleted:false}}
    m.events.forEach(e=>{R.match_events[e.id]={id:e.id,team_id:tid,match_id:m.id,seq:0,type:e.t,player_id:e.playerId||null,assist_id:e.assistId||null,off_id:e.offId||null,on_id:e.onId||null,how:e.how||null,detail:e.detail||null,reason:e.reason||null,opp_num:e.oppNum===undefined||e.oppNum===''||e.oppNum===null?null:String(e.oppNum),opp_name:e.oppName||null,note_text:e.t==='period'?(e.label||null):(e.text||null),period:num(e.period),minute:num(e.minute),ts:e.ts||null,deleted:false}});
  });
  TD.sessions.forEach(x=>{
    R.sessions[x.id]={id:x.id,team_id:tid,kind:x.kind||'training',title:x.title||'',session_date:x.date||null,session_time:x.time||null,location:x.location||'',notes:x.notes||'',deleted:false};
    for(const pid in (x.records||{})){const a=x.records[pid];R.attendance[x.id+'|'+pid]={session_id:x.id,player_id:pid,team_id:tid,attended:!!a.attended,late:!!a.late,left_early:!!a.leftEarly,mins_late:num(a.minsLate),mins_early:num(a.minsEarly),reason:a.reason||null,note:a.note||null,deleted:false}}
  });
  return R;
}
const sigOf=o=>JSON.stringify(o);
function pendingCount(){
  let n=0;
  for(const id in DB.teams){const TD=DB.teams[id];if(TD.role!=='coach'||!TD.team)continue;
    const R=rowsFor(TD),sg=DB.sigs[id]||{};
    for(const tb of TABLES){const old=sg[tb]||{};
      for(const k in R[tb])if(old[k]!==sigOf(R[tb][k]))n++;
      for(const k in old)if(!(k in R[tb]))n++}}
  return n;
}
async function pushTeam(TD){
  const tid=TD.team.id,R=rowsFor(TD),sg=(DB.sigs[tid]=DB.sigs[tid]||{});let n=0;
  for(const tb of TABLES){
    const cur=R[tb],old=(sg[tb]=sg[tb]||{});
    const up=[];for(const k in cur){const sig=sigOf(cur[k]);if(old[k]!==sig)up.push([k,sig,cur[k]])}
    for(let i=0;i<up.length;i+=100){
      const part=up.slice(i,i+100);
      await rest('POST','/'+tb+'?on_conflict='+PK[tb].join(','),part.map(x=>x[2]),'resolution=merge-duplicates,return=minimal');
      part.forEach(x=>{old[x[0]]=x[1]});n+=part.length;
    }
    for(const k of Object.keys(old).filter(k=>!(k in cur))){
      const ks=k.split('|');const q=PK[tb].map((c,i)=>c+'=eq.'+encodeURIComponent(ks[i])).join('&');
      await rest('PATCH','/'+tb+'?'+q,{deleted:true},'return=minimal');delete old[k];n++;
    }
  }
  return n;
}
function applyRows(tb,rows,TD){
  let changed=false;
  const touched=new Set();
  for(const r of rows){
    const del=!!r.deleted;
    switch(tb){
      case 'teams':{const t=TD.team;Object.assign(t,{name:r.name,age:r.age||'',ground:r.ground||'',primary:r.primary_colour||t.primary,secondary:r.secondary_colour||t.secondary,onPitch:r.on_pitch||t.onPitch,periods:r.periods||t.periods,periodMins:r.period_mins||t.periodMins});break}
      case 'players':{
        if(del){TD.players=TD.players.filter(x=>x.id!==r.id);break}
        let p=TD.players.find(x=>x.id===r.id);if(!p){p={id:r.id};TD.players.push(p)}
        p.num=r.num;p.name=r.name;p.pos=r.pos||'';p.left=!!r.left_squad;break}
      case 'matches':{
        if(del){TD.matches=TD.matches.filter(x=>x.id!==r.id);if(TD.activeId===r.id)TD.activeId=null;break}
        let m=TD.matches.find(x=>x.id===r.id);if(!m){m={id:r.id,squad:{},events:[]};TD.matches.push(m)}
        Object.assign(m,{opp:r.opp||'',venue:r.venue||'home',location:r.location||'',comp:r.comp||'',date:r.match_date||'',time:r.match_time||'',status:r.status,periods:r.periods,periodMins:r.period_mins,onPitch:r.on_pitch,clock:r.clock||{period:1,state:'ready',startedAt:null,accMs:0},notes:r.notes||'',recMode:r.rec_mode||undefined,createdAt:r.created_at_ms||0,finishedAt:r.finished_at_ms||undefined});break}
      case 'match_squad':{
        const m=TD.matches.find(x=>x.id===r.match_id);if(!m)break;
        if(del)delete m.squad[r.player_id];else m.squad[r.player_id]={role:r.role,reason:r.reason||''};break}
      case 'match_events':{
        const m=TD.matches.find(x=>x.id===r.match_id);if(!m)break;
        m.events=m.events.filter(x=>x.id!==r.id);
        if(!del){const e={id:r.id,t:r.type,period:r.period||1,minute:r.minute==null?0:r.minute,ts:r.ts||0};
          if(r.player_id)e.playerId=r.player_id;if(r.assist_id)e.assistId=r.assist_id;if(r.off_id)e.offId=r.off_id;if(r.on_id)e.onId=r.on_id;
          if(r.how)e.how=r.how;if(r.detail)e.detail=r.detail;if(r.reason)e.reason=r.reason;if(r.opp_num!=null)e.oppNum=r.opp_num;if(r.opp_name)e.oppName=r.opp_name;
          if(r.type==='period')e.label=r.note_text||'';else if(r.note_text)e.text=r.note_text;
          m.events.push(e)}
        touched.add(m.id);break}
      case 'sessions':{
        if(del){TD.sessions=TD.sessions.filter(x=>x.id!==r.id);break}
        let x=TD.sessions.find(q=>q.id===r.id);if(!x){x={id:r.id,records:{}};TD.sessions.push(x)}
        Object.assign(x,{kind:r.kind||'training',title:r.title||'',date:r.session_date||'',time:r.session_time||'',location:r.location||'',notes:r.notes||''});break}
      case 'attendance':{
        const x=TD.sessions.find(q=>q.id===r.session_id);if(!x)break;
        if(del)delete x.records[r.player_id];else x.records[r.player_id]={attended:!!r.attended,late:!!r.late,leftEarly:!!r.left_early,minsLate:r.mins_late||'',minsEarly:r.mins_early||'',reason:r.reason||'',note:r.note||''};break}
    }
    changed=true;
  }
  touched.forEach(id=>{const m=TD.matches.find(x=>x.id===id);if(m)m.events.sort((a,b)=>(a.ts||0)-(b.ts||0))});
  // refresh signatures so pulled rows are not pushed back
  const tid=TD.team.id,R=rowsFor(TD),sg=(DB.sigs[tid]=DB.sigs[tid]||{}),old=(sg[tb]=sg[tb]||{});
  for(const r of rows){const k=PK[tb].map(c=>r[c]).join('|');if(r.deleted)delete old[k];else if(R[tb][k])old[k]=sigOf(R[tb][k])}
  return changed;
}
async function pullTeam(TD){
  const tid=TD.team.id,cu=(DB.cursors[tid]=DB.cursors[tid]||{});let changed=false;
  for(const tb of TABLES){
    let since=cu[tb]||'1970-01-01T00:00:00+00:00';
    for(;;){
      const rows=await rest('GET',`/${tb}?${tb==='teams'?'id':'team_id'}=eq.${encodeURIComponent(tid)}&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=1000`);
      if(!rows||!rows.length)break;
      if(applyRows(tb,rows,TD))changed=true;
      const last=Date.parse(rows[rows.length-1].updated_at);
      since=new Date(last-3000).toISOString();cu[tb]=since;
      if(rows.length<1000)break;
    }
  }
  return changed;
}
async function syncNow(manual){
  if(!CLOUD||!DB.user||SYNC.busy)return;
  if(!navigator.onLine){SYNC.state='offline';updateBadge();return}
  SYNC.busy=true;SYNC.state='syncing';SYNC.msg='';updateBadge();
  let changed=false;
  try{
    await getJwt();
    // who am I / my teams
    const prof=await rest('GET','/profiles?user_id=eq.'+encodeURIComponent(DB.user.id)+'&select=is_superuser,display_name');
    if(prof&&prof[0]){DB.user.isSuper=!!prof[0].is_superuser;if(prof[0].display_name)DB.user.name=prof[0].display_name}
    const mem=await rest('GET','/team_members?user_id=eq.'+encodeURIComponent(DB.user.id)+'&deleted=eq.false&select=team_id,role');
    const roleOf={};(mem||[]).forEach(x=>{roleOf[x.team_id]=x.role});
    const ids=new Set(Object.keys(roleOf));
    if(DB.user.isSuper)(DB.view||[]).forEach(id=>ids.add(id));
    for(const id of ids){
      if(!DB.teams[id]){DB.teams[id]=Object.assign(EMPTY(),{team:{id,name:'…',age:'',ground:'',primary:'#0b6b3a',secondary:'#ffffff',onPitch:11,periods:2,periodMins:45}});changed=true}
      const r=roleOf[id]||'viewer';if(DB.teams[id].role!==r){DB.teams[id].role=r;changed=true}
    }
    for(const id of Object.keys(DB.teams)){if(!ids.has(id)){delete DB.teams[id];delete DB.sigs[id];delete DB.cursors[id];changed=true}}
    if(!DB.teams[DB.cur]){const f=Object.keys(DB.teams)[0]||null;DB.cur=f;changed=true}
    S=DB.teams[DB.cur]||EMPTY();
    // push (coach teams), then pull everything
    const rev=REV;
    for(const id of ids){const TD=DB.teams[id];if(TD.role==='coach'&&TD.team.name!=='…')await pushTeam(TD)}
    if(REV===rev){
      for(const id of ids){if(await pullTeam(DB.teams[id]))changed=true}
      for(const id of ids){
        const ms=await rest('GET','/team_members?team_id=eq.'+encodeURIComponent(id)+'&deleted=eq.false&select=user_id,role,display_name,email');
        DB.members[id]=ms||[];
      }
    }else SYNC.again=true;
    S=DB.teams[DB.cur]||EMPTY();
    SYNC.state='ok';SYNC.last=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  }catch(e){
    if(e&&(e.code==='auth'||e.status===401))SYNC.state='auth';
    else if(e instanceof TypeError||!navigator.onLine)SYNC.state='offline';
    else{SYNC.state='error';SYNC.msg=e.message||'Sync failed'}
  }
  SYNC.busy=false;
  updateBadge();
  if(changed||manual)renderSafe();
  if(SYNC.again){SYNC.again=false;schedSync(500)}
}
function updateBadge(){document.querySelectorAll('.sbadge').forEach(el=>{const b=syncBadge();const t=document.createElement('div');t.innerHTML=b;const n=t.firstElementChild;if(n){el.className=n.className;el.textContent=n.textContent;el.dataset.act=n.dataset.act}})}
function renderSafe(){
  if(DRAG&&DRAG.on)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!manualRender)return;
  render();
}
let manualRender=false;
function schedSync(ms){if(!CLOUD||!DB.user)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),ms||3000)}
if(CLOUD){
  window.addEventListener('online',()=>syncNow());
  window.addEventListener('offline',()=>{SYNC.state='offline';updateBadge()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
  setInterval(()=>{if(!document.hidden)syncNow()},25000);
}

/* ---------- pitch recording (drag & drop / tap) ---------- */
function formation(ids){
  const g={GK:[],DEF:[],MID:[],FWD:[]},unk=[];
  byNum(ids).forEach(id=>{const p=P(id);(g[p.pos]||unk).push(id)});
  if(unk.length){
    if(!g.GK.length&&ids.length>=5)g.GK.push(unk.shift());
    const n=unk.length,d=Math.round(n*.4),f=Math.round(n*.25),mid=n-d-f;
    g.DEF.push(...unk.slice(0,d));g.MID.push(...unk.slice(d,d+mid));g.FWD.push(...unk.slice(d+mid));
  }
  return [g.FWD,g.MID,g.DEF,g.GK].filter(r=>r.length);
}
function pitchBlock(m,rm){
  const drag=rm==='drag';
  const on=[...pitchSet(m)].filter(id=>P(id));

  const tk=(id,where)=>{
    const p=P(id);
    const attrs=drag?`data-drag="1" data-id="${id}" data-where="${where}" ${where==='pitch'?'data-drop="tok"':''}`:`data-act="${where==='pitch'?'tapPlayer':'tapBench'}" data-id="${id}"`;
    return `<div class="tk" ${attrs}><b>${esc(p.num)}${goals[id]?`<em>⚽${goals[id]>1?goals[id]:''}</em>`:''}${yel[id]?'<u></u>':''}</b><span>${esc(first(p.name))}</span></div>`;
  };
  const bench=benchIds(m);

  return `<div class="pitchwrap"><div class="pitch" ${drag?'data-drop="pitch"':''}>${svg}${drag?`<div class="goalmouth" data-drop="goal">⚽ Drop on goal</div>`:''}${lines.map(r=>`<div class="line">${r.map(id=>tk(id,'pitch')).join('')}</div>`).join('')}</div></div>
  <div class="bench" ${drag?'data-drop="bench"':''}><span class="bl">Bench</span>${bench.length?bench.map(id=>tk(id,'bench')).join(''):'<i>No one on the bench</i>'}</div>
  ${drag?`<div class="tray">${[['shot','🎯','Shot'],['keypass','🔑','Pass'],['save','🧤','Save'],['tackle','🛡️','Tackle'],['yellow','🟨','Yellow'],['red','🟥','Red']].map(([k,i,l])=>`<div class="dz" data-drop="${k}"><i>${i}</i>${l}</div>`).join('')}</div>
  <div class="hint">Drag a player onto the goal or an action. Drag a pitch player to the bench to take them off. Drag a bench player onto the pitch, or onto the player they replace, to bring them on.</div>`
  :`<div class="hint">Tap a player on the pitch to record what they did. Tap a bench player to bring them on.</div>`}
  <div class="row" style="margin-bottom:6px"><button class="btn sec" data-act="ev" data-k="oppgoal">🥅 Goal against</button><button class="btn sec" data-act="ev" data-k="note">📝 Note</button></div>`;
}
function startFlow(kind,pid){
  const m=M();if(!m)return;
  if(kind==='keypass'||kind==='yellow'||kind==='red'){addEventUndo(m,{t:kind,playerId:pid});return}
  if(kind==='sub')V.sheet={kind:'sub',step:1,d:{off:pid}};
  else V.sheet={kind,step:1,d:{pid}};
  renderSheet();
}
function dropOn(src,where,target,tid){
  const m=M();if(!m||!P(src))return;
  const ready=m.clock.state==='ready';
  const ACT=['goal','shot','keypass','save','tackle','yellow','red'];
  if(where==='pitch'){
    if(target==='bench'){ready?(m.squad[src].role='sub',save(),render()):startFlow('sub',src);return}
    if(ACT.includes(target)){ready?toast('Kick off first'):startFlow(target,src)}
  }else{
    if(target==='tok'&&tid&&tid!==src){
      if(ready){m.squad[tid].role='sub';m.squad[src].role='starter';save();render()}
      else{V.sheet={kind:'sub',step:2,d:{off:tid,on:src}};renderSheet()}
    }else if(target==='pitch'||target==='tok'){
      if(ready){m.squad[src].role='starter';save();render()}
      else{V.sheet={kind:'sub',step:0,d:{on:src}};renderSheet()}
    }
  }
}
let DRAG=null;
function dragEls(x,y){const g=document.querySelector('.ghost');if(g)g.style.display='none';const el=document.elementFromPoint(x,y);if(g)g.style.display='';return el}
document.addEventListener('pointerdown',e=>{
  const tk=e.target.closest&&e.target.closest('.tk[data-drag]');if(!tk||e.button>0)return;
  DRAG={id:tk.dataset.id,where:tk.dataset.where,x:e.clientX,y:e.clientY,on:false,el:tk,hot:null};
});
document.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  if(!DRAG.on){
    if(Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)<8)return;
    DRAG.on=true;const g=DRAG.el.cloneNode(true);g.className='tk ghost';g.removeAttribute('data-drag');g.removeAttribute('data-drop');g.style.pointerEvents='none';document.body.appendChild(g);
    DRAG.ghost=g;DRAG.el.style.opacity='.35';buzz();
  }
  e.preventDefault();
  DRAG.ghost.style.left=e.clientX+'px';DRAG.ghost.style.top=e.clientY+'px';
  const el=dragEls(e.clientX,e.clientY);const dz=el&&el.closest('[data-drop]');
  if(DRAG.hot&&DRAG.hot!==dz)DRAG.hot.classList.remove('drop-on');
  const ok=dz&&dz!==DRAG.el&&dz.dataset.drop;
  if(ok){dz.classList.add('drop-on');DRAG.hot=dz}else DRAG.hot=null;
},{passive:false});
function endDrag(e,cancel){
  if(!DRAG)return;const d=DRAG;DRAG=null;
  if(!d.on)return;
  if(d.ghost)d.ghost.remove();d.el.style.opacity='';
  document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on'));
  if(cancel)return;
  const el=dragEls(e.clientX,e.clientY);const dz=el&&el.closest('[data-drop]');
  if(dz&&dz!==d.el&&dz.dataset.drop)dropOn(d.id,d.where,dz.dataset.drop,dz.dataset.id);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

function evSave(){

  const need=['goal','shot','save','tackle','keypass','yellow','red'].includes(d.t);

  if(d.t==='sub'&&(!d.offId||!d.onId||d.offId===d.onId)){s.err='Choose who came off and who came on.';renderSheet();return}
  const e={id:d.id||uid(),t:d.t,period:+d.period||1,minute:mn,ts:d.ts||Date.now()};
  if(d.t==='goal'){if(d.playerId==='OPPOG'){e.playerId=null;e.how='Opp own goal'}else{e.playerId=d.playerId;e.how=d.how==='Opp own goal'?'':(d.how||'');e.assistId=d.assistId||null}}
