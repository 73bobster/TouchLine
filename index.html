  else if(['keypass','yellow','red'].includes(d.t))e.playerId=d.playerId;
  else if(d.t==='sub'){e.offId=d.offId;e.onId=d.onId;e.reason=d.reason||''}
  else if(d.t==='note')e.text=(d.text||'').trim();
  else if(d.t==='period')e.label=d.label;
  const i=mm.events.findIndex(x=>x.id===e.id);
  if(i>=0)mm.events[i]=e;else mm.events.push(e);
  save();V.sheet={kind:'log'};render();
}

/* ---------- extra sheets ---------- */
async function loadInvites(){
  try{const l=await rest('GET','/invites?team_id=eq.'+encodeURIComponent(S.team.id)+'&uses_left=gt.0&expires_at=gt.'+encodeURIComponent(new Date().toISOString())+'&order=created_at.desc');
    if(V.sheet&&V.sheet.kind==='invite'){V.sheet.d.list=l;renderSheet()}}catch(e){if(V.sheet&&V.sheet.kind==='invite'){V.sheet.d.err=e.message;renderSheet()}}
}
const inviteLink=c=>location.origin+location.pathname+'?invite='+c;
function sheetExtra(s,m,d){
  switch(s.kind){
    case 'pstat':return pstatBody(d.id);
    case 'tap':{const p=P(d.pid);return sheetWrap(esc('#'+p.num+' '+p.name),`<div class="evg">${[['goal','⚽','Goal'],['shot','🎯','Shot'],['keypass','🔑','Key pass'],['save','🧤','Save'],['tackle','🛡️','Tackle'],['yellow','🟨','Yellow'],['red','🟥','Red'],['sub','🔄','Sub off']].map(([k,i,l])=>`<button data-act="tapDo" data-k="${k}"><i>${i}</i>${l}</button>`).join('')}</div>`)}
    case 'tapbench':{const p=P(d.pid);return sheetWrap(esc('#'+p.num+' '+p.name)+' comes on for?',pgrid(byNum([...pitchSet(m)]),'tapOn'))}
    case 'evEdit':return evEditBody(s);
    case 'sessNew':case 'sessEdit':
      return sheetWrap(s.kind==='sessNew'?'New session':'Session details',`<div class="chips">${SESS_KINDS.map(([k,l])=>`<button class="${d.kind===k?'on':''}" data-act="sessKind" data-val="${k}">${l}</button>`).join('')}</div>
      <label>Title (optional)<input data-sbind="title" value="${esc(d.title||'')}" placeholder="e.g. Tuesday training, Christmas party" autocomplete="off"></label>
      <div class="row"><label>Date<input type="date" data-sbind="date" value="${esc(d.date)}"></label><label>Time<input type="time" data-sbind="time" value="${esc(d.time)}"></label></div>
      <label>Where<input data-sbind="location" value="${esc(d.location||'')}" autocomplete="off"></label>
      <button class="btn block lg" data-act="sessSave">${s.kind==='sessNew'?'Create and mark attendance':'Save'}</button>`);
    case 'reauth':return sheetWrap('Sign in again',`<div class="note" style="margin-top:0">${esc(DB.user.email)}. Your data on this phone is safe and will sync once you are back in.</div><label>Password<input type="password" data-sbind="password" autocomplete="current-password"></label>${d.err?`<div class="err">${esc(d.err)}</div>`:''}<button class="btn block lg" data-act="reauthGo">Sign in</button>`);
    case 'signout':return sheetWrap('Sign out?',`<p style="margin-top:0">${d.n?`<b>${d.n} change${d.n===1?'':'s'} have not been uploaded yet</b> and would be lost. `:''}Signing out removes the team data from this phone. You can sign in again to get it back.</p><div class="row"><button class="btn sec" data-act="closeSheet">Stay signed in</button><button class="btn bad" data-act="signOutDo">Sign out</button></div>`);
    case 'join':return sheetWrap('Join with an invite code',`<label>Invite code<input data-sbind="code" value="${esc(d.code||'')}" autocapitalize="characters" autocomplete="off" placeholder="e.g. K7M2QX9P"></label>${d.err?`<div class="err">${esc(d.err)}</div>`:''}<button class="btn block lg" data-act="joinSheet">Join</button>`);
    case 'invite':return sheetWrap('Invite to '+esc(S.team.name),`<div class="lbl">They join as</div><div class="chips">${[['reviewer','Reviewer (view only)'],['coach','Coach (can edit)']].map(([k,l])=>`<button class="${d.role===k?'on':''}" data-act="invRole" data-val="${k}">${l}</button>`).join('')}</div>
      <button class="btn block lg" data-act="invMake" ${d.busy?'disabled':''}>${d.busy?'Creating…':'Create invite'}</button>
      ${d.err?`<div class="err">${esc(d.err)}</div>`:''}
      ${d.code?`<div class="card" style="margin-top:12px"><div class="lbl">Code (works once, 14 days)</div><div style="font-size:30px;font-weight:800;letter-spacing:.12em">${esc(d.code)}</div><textarea id="sharetext" readonly style="min-height:70px;margin-top:8px">${esc(inviteLink(d.code))}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="invCopy">Copy link</button>${navigator.share?`<button class="btn sec" data-act="invShare">Share…</button>`:''}</div></div>`:''}
      <h2>Open invites</h2>${d.list?(d.list.length?d.list.map(i=>`<div class="kv"><span><b>${esc(i.code)}</b> · ${esc(i.role)}</span><button data-act="invDel" data-val="${esc(i.code)}" style="min-height:36px">Cancel</button></div>`).join(''):'<div class="note">No open invites.</div>'):'<div class="note">Loading…</div>'}`);
    case 'members':{const list=DB.members[S.team.id]||[];return sheetWrap('Who has access',list.length?list.map(x=>`<div class="kv" style="align-items:center"><span>${esc(x.display_name||x.email||'Someone')}<br><small style="color:var(--mute)">${esc(x.email||'')}</small></span><span style="display:flex;gap:6px;align-items:center"><button data-act="memRole" data-id="${esc(x.user_id)}" data-val="${x.role==='coach'?'reviewer':'coach'}" style="min-height:36px;font-size:13px">${x.role==='coach'?'Coach':'Reviewer'} ⇄</button>${x.user_id!==DB.user.id?`<button data-act="memDel" data-id="${esc(x.user_id)}" style="min-height:36px;color:var(--bad)">Remove</button>`:''}</span></div>`).join('')+`${d.err?`<div class="err">${esc(d.err)}</div>`:''}<div class="note">Tap the role to switch between Coach and Reviewer.</div>`:'<div class="empty">No one yet.</div>')}
    case 'allteams':return sheetWrap('All teams',d.list?(d.list.length?d.list.map(t=>`<div class="kv" style="align-items:center"><span>${esc(t.name)}</span><span style="display:flex;gap:6px"><button data-act="atView" data-id="${esc(t.id)}" style="min-height:36px;font-size:13px">View</button><button data-act="atCoach" data-id="${esc(t.id)}" style="min-height:36px;font-size:13px">Coach it</button></span></div>`).join(''):'<div class="empty">No teams yet.</div>'):'<div class="note">Loading…</div>')+(d.err?`<div class="err">${esc(d.err)}</div>`:'')+'<div class="note">View lets you look at everything, read only. Coach it adds you as a coach so you can record and edit.</div>';
  }
  return '';
}

/* ---------- extra actions ---------- */
const EDIT_ACTS=new Set(['playerNew','playerEdit','playerRestore','playerSave','playerRemove','importOpen','importParse','importAdd','importBack','importDel','matchNew','venue','matchNext','backDetails','cancelMatch','role','reason','restSub','toLive','editLineup','ko','pause','resume','endPeriod','nextPeriod','finishEarly','finish','ev','pick','oppSave','noteSave','evNew','evEdit','evSave','evDel','attSet','attAll','attMins','attEarly','attReason','sessNew','sessEdit','sessSave','sessDel','recMode','recDefault','tapPlayer','tapBench','tapDo','tapOn','preset','fmt']);
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const b=new Uint8Array(8);(window.crypto||{getRandomValues:a=>{for(let i=0;i<a.length;i++)a[i]=Math.random()*256}}).getRandomValues(b);return Array.from(b,x=>A[x%A.length]).join('')}
async function syncWait(){for(let i=0;i<30&&SYNC.busy;i++)await new Promise(r=>setTimeout(r,300));SYNC.state='idle';await syncNow(true)}
async function refreshMembers(){
  try{DB.members[S.team.id]=await rest('GET','/team_members?team_id=eq.'+encodeURIComponent(S.team.id)+'&deleted=eq.false&select=user_id,role,display_name,email');if(V.sheet&&V.sheet.kind==='members')renderSheet()}
  catch(e){if(V.sheet&&V.sheet.kind==='members'){V.sheet.d.err=e.message;renderSheet()}}
}
async function joinTeamAs(teamId,role){
  await rest('POST','/team_members?on_conflict=team_id,user_id',{team_id:teamId,user_id:DB.user.id,role,display_name:DB.user.name,email:DB.user.email,deleted:false},'resolution=merge-duplicates,return=minimal');
  await syncWait();if(DB.teams[teamId])setCur(teamId);
}
function copyLink(){
  const t=inviteLink(V.sheet.d.code),ta=document.getElementById('sharetext');
  const fb=()=>{if(ta){ta.focus();ta.select()}toast('Touch and hold the link to copy')};
  try{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Link copied'),fb)}catch(e){fb()}
}
function actExtra(a,ds,el){
  if(EDIT_ACTS.has(a)&&!canEdit()){toast('View only');return true}
  const adm=()=>canEdit()||(DB.user&&DB.user.isSuper);
  switch(a){
    case 'toastAct':{const f=TOAST_FN;TOAST_FN=null;const t=$('#toast');if(t)t.style.display='none';if(f)f();return true}
    case 'authMode':V.auth.mode=ds.v;V.auth.err='';render();return true;
    case 'authGo':doAuth();return true;
    case 'syncNow':manualRender=true;toast('Syncing…');syncNow(true).finally(()=>{manualRender=false;if(SYNC.state==='ok')toast('Up to date');render()});return true;
    case 'reauth':V.sheet={kind:'reauth',d:{password:'',err:''}};renderSheet();return true;
    case 'reauthGo':doReauth();return true;
    case 'signOutAsk':V.sheet={kind:'signout',d:{n:CLOUD?pendingCount():0}};renderSheet();return true;
    case 'signOutDo':doSignOut();return true;
    case 'joinNow':{
      const c=V.auth.invite.trim();if(!c){V.err='Enter the invite code.';V.errFor='join';render();return true}
      V.err='';V.errFor='join';joinWithCode(c).then(()=>{V.auth.invite='';V.err='';V.newTeam=false}).catch(e=>{V.err=e.message}).finally(render);return true}
    case 'newTeamOpen':V.newTeam=true;V.err='';render();return true;
    case 'newTeamBack':V.newTeam=false;V.err='';render();return true;
    case 'switchTeam':setCur(ds.id);render();return true;
    case 'createTeam':{
      const t=V.draft;
      if(CLOUD){createTeamCloud();return true}
      if(!t.name.trim()){V.err='Give your team a name first.';render();return true}
      V.err='';const td=Object.assign(EMPTY(),{team:Object.assign({id:'local'},t,{name:t.name.trim()}),role:'coach'});
      DB.teams.local=td;DB.cur='local';S=td;save();V.tab='squad';render();return true}
    case 'demoRole':S.role=ds.v;save();render();return true;
    case 'allTeamsOpen':
      V.sheet={kind:'allteams',d:{list:null}};renderSheet();
      rest('GET','/teams?select=id,name&deleted=eq.false&order=name').then(l=>{if(V.sheet&&V.sheet.kind==='allteams'){V.sheet.d.list=l;renderSheet()}}).catch(e=>{if(V.sheet&&V.sheet.kind==='allteams'){V.sheet.d.list=[];V.sheet.d.err=e.message;renderSheet()}});return true;
    case 'atView':{if(!DB.view.includes(ds.id))DB.view.push(ds.id);V.sheet=null;V.newTeam=false;syncWait().then(()=>{if(DB.teams[ds.id])setCur(ds.id);render()});return true}
    case 'atCoach':joinTeamAs(ds.id,'coach').then(()=>{V.sheet=null;V.newTeam=false;render()}).catch(e=>{if(V.sheet){V.sheet.d.err=e.message;renderSheet()}});return true;
    case 'assignMe':joinTeamAs(S.team.id,'coach').then(render).catch(e=>toast(e.message));return true;
    case 'inviteOpen':if(!adm())return true;V.sheet={kind:'invite',d:{role:'reviewer',code:'',list:null}};renderSheet();loadInvites();return true;
    case 'invRole':V.sheet.d.role=ds.val;renderSheet();return true;
    case 'invMake':{const d=V.sheet.d;d.busy=true;d.err='';renderSheet();const code=genCode();
      rest('POST','/invites',{code,team_id:S.team.id,role:d.role,uses_left:1},'return=minimal').then(()=>{d.code=code;d.busy=false;return loadInvites()}).catch(e=>{d.busy=false;d.err=e.message;renderSheet()});return true}
    case 'invCopy':copyLink();return true;
    case 'invShare':try{navigator.share({text:'Join '+S.team.name+' on Touchline: '+inviteLink(V.sheet.d.code)+' (code '+V.sheet.d.code+')'}).catch(()=>{})}catch(e){}return true;
    case 'invDel':rest('DELETE','/invites?code=eq.'+encodeURIComponent(ds.val)).then(loadInvites).catch(e=>toast(e.message));return true;
    case 'membersOpen':if(!adm())return true;V.sheet={kind:'members',d:{}};renderSheet();refreshMembers();return true;
    case 'memRole':rest('PATCH','/team_members?team_id=eq.'+encodeURIComponent(S.team.id)+'&user_id=eq.'+encodeURIComponent(ds.id),{role:ds.val},'return=minimal').then(refreshMembers).catch(e=>{V.sheet.d.err=e.message;renderSheet()});return true;
    case 'memDel':rest('PATCH','/team_members?team_id=eq.'+encodeURIComponent(S.team.id)+'&user_id=eq.'+encodeURIComponent(ds.id),{deleted:true},'return=minimal').then(refreshMembers).catch(e=>{V.sheet.d.err=e.message;renderSheet()});return true;

    case 'pstat':V.sheet={kind:'pstat',d:{id:ds.id}};renderSheet();return true;
    case 'sortStats':V.sort=ds.v;render();return true;

    /* attendance */
    case 'attMode':V.attMode=ds.v;render();return true;
    case 'sessNew':V.sheet={kind:'sessNew',d:{kind:'training',title:'',date:todayStr(),time:nowHM(),location:S.team.ground||''}};renderSheet();return true;
    case 'sessEdit':{const x=S.sessions.find(q=>q.id===ds.id);V.sheet={kind:'sessEdit',d:{id:x.id,kind:x.kind,title:x.title,date:x.date,time:x.time,location:x.location}};renderSheet();return true}
    case 'sessKind':V.sheet.d.kind=ds.val;renderSheet();return true;
    case 'sessSave':{const d=V.sheet.d;
      if(d.id)Object.assign(S.sessions.find(q=>q.id===d.id),{kind:d.kind,title:d.title,date:d.date,time:d.time,location:d.location});
      else{const x={id:uid(),kind:d.kind,title:d.title||'',date:d.date||todayStr(),time:d.time||'',location:d.location||'',notes:'',records:{}};S.sessions.push(x);V.sess=x.id}
      save();V.sheet=null;render();return true}
    case 'sessOpen':V.sess=ds.id;render();return true;
    case 'sessBack':V.sess=null;render();return true;
    case 'sessDel':ask({title:'Delete this session?',msg:'Its attendance record is removed.',ok:'Delete',danger:true,fn:'delSession',arg:ds.id});return true;
    case 'attSet':{
      const x=S.sessions.find(q=>q.id===V.sess);const cur=x.records[ds.id];
      const state=!cur?'':cur.attended?(cur.late?'late':'in'):'out';
      if(state===ds.v){delete x.records[ds.id]}
      else{const r=cur||{attended:true,late:false,leftEarly:false,minsLate:'',minsEarly:'',reason:'',note:''};
        if(ds.v==='out'){r.attended=false;r.late=false;r.leftEarly=false;r.minsLate='';r.minsEarly=''}
        else{r.attended=true;r.late=ds.v==='late';r.reason='';if(!r.late)r.minsLate=''}
        x.records[ds.id]=r}
      save();render();return true}
    case 'attAll':{const x=S.sessions.find(q=>q.id===V.sess);activePlayers().forEach(p=>{if(!x.records[p.id])x.records[p.id]={attended:true,late:false,leftEarly:false,minsLate:'',minsEarly:'',reason:'',note:''}});save();render();return true}
    case 'attMins':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r[ds.f]=String(r[ds.f])===ds.val?'':ds.val;save();render();return true}
    case 'attEarly':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r.leftEarly=!r.leftEarly;if(!r.leftEarly)r.minsEarly='';save();render();return true}
    case 'attReason':{const r=S.sessions.find(q=>q.id===V.sess).records[ds.id];r.reason=r.reason===ds.val?'':ds.val;save();render();return true}

    /* log editing */
    case 'logOpen':V.logId=ds.id||null;V.sheet={kind:'log'};renderSheet();return true;
    case 'evNew':{const mm=logMatch();const per=mm.clock&&mm.clock.state!=='ready'?Math.min(mm.clock.period,mm.periods):1;V.sheet={kind:'evEdit',d:{isNew:true,t:'goal',period:per,minute:'',how:'',playerId:'',assistId:''},err:''};renderSheet();return true}
    case 'evEdit':{const mm=logMatch();const e=mm.events.find(x=>x.id===ds.id);if(!e)return true;
      const d=Object.assign({},e,{playerId:e.playerId||'',assistId:e.assistId||'',how:e.how||'',detail:e.detail||'',offId:e.offId||'',onId:e.onId||''});
      if(e.t==='goal'&&e.how==='Opp own goal'){d.playerId='OPPOG'}
      V.sheet={kind:'evEdit',d,err:''};renderSheet();return true}
    case 'evSave':evSave();return true;
    case 'evBack':V.sheet={kind:'log'};renderSheet();return true;
    case 'evDel':ask({title:'Delete this event?',msg:'It will be removed from the log and the score will update.',ok:'Delete',danger:true,fn:'delEvent',arg:ds.id});return true;

    /* recording formats */
    case 'recMode':{const m=M();if(m)m.recMode=ds.v;DB.prefs.recMode=ds.v;save();render();return true}
    case 'recDefault':DB.prefs.recMode=ds.v;save();render();return true;
    case 'continueLive':S.activeId=ds.id;V.tab='match';save();render();return true;
    case 'tapPlayer':case 'tapBench':{
      const m=M();if(!m)return true;
      if(m.clock.state==='ready'){toast('Kick off first, or use Edit team');return true}
      V.sheet={kind:a==='tapPlayer'?'tap':'tapbench',d:{pid:ds.id}};renderSheet();return true}
    case 'tapDo':startFlow(ds.k,V.sheet.d.pid);return true;
    case 'tapOn':V.sheet={kind:'sub',step:2,d:{off:ds.id,on:V.sheet.d.pid}};renderSheet();return true;
  }
  return false;
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  const app=$('#app');
  const bd=document.body.dataset;
  bd.view=(CLOUD&&!DB.user)?'auth':(!S.team||V.newTeam)?'noteam':'app';bd.tab=V.tab;
  if(CLOUD&&!DB.user){app.innerHTML=authView();renderSheet();return}
  if(!S.team||V.newTeam){app.innerHTML=CLOUD?noTeamView():onboard();renderSheet();return}
  let body='';
  if(V.tab==='team')body=teamView();
  else if(V.tab==='squad')body=squadView();
  else if(V.tab==='stats')body=statsView();
  else if(V.tab==='attend')body=attendView();
  else if(V.tab==='history')body=historyView();
  else body=matchView();
  app.innerHTML=body+tabbar();
  renderSheet();
}

setInterval(()=>{
  const m=M()||(!canEdit()&&liveOther());if(!m||m.status!=='live'||V.tab!=='match')return;
  const c=$('#clock');if(c)c.textContent=fmtClock(m);
},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const m=M();if(m&&m.status==='live'&&m.clock.state==='running')lockScreen();const c=$('#clock');if(c&&m)c.textContent=fmtClock(m)}});

(()=>{const q=new URLSearchParams(location.search).get('invite');if(q){V.auth.invite=q.toUpperCase();V.auth.mode='up';if(CLOUD&&DB.user)V.newTeam=true}})();
render();
if(CLOUD&&DB.user)setTimeout(()=>syncNow(),300);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.__touchline={matchSummary,applyRows,S:()=>S,DB:()=>DB,V,act,render,parseRoster,syncNow,rowsFor,pendingCount};
})();
</script>
